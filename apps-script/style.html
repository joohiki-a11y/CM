<style>
/* CM UI v3: Bitkub CI */
:root {
--bk-green: #02d767;
--bk-green-005: #00bf61;
--bk-green-007: #007339;
--bk-light-green: #a3ed24;
--bk-yellow: #ffff00;
--bk-gray: #404040;
--bk-gray-003: #969696;
--bg: #f3f5f4;
--surface: #ffffff;
--surface-soft: #f7f9f8;
--border: #e4e9e6;
--text: #252a27;
--muted: #717873;
--radius-sm: 10px;
--radius: 14px;
--radius-lg: 20px;
--shadow-sm: 0 2px 8px rgba(21, 52, 35, .07);
--shadow: 0 10px 30px rgba(21, 52, 35, .09);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
margin: 0;
font-family: "IBM Plex Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background: var(--bg);
color: var(--text);
line-height: 1.5;
-webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; }
.wrap { width: min(100%, 1440px); margin: 0 auto; padding-left: 22px; padding-right: 22px; }
/* Header */
.app-header {
position: sticky; top: 0; z-index: 30;
background: rgba(255, 255, 255, .97);
border-top: 4px solid var(--bk-green);
border-bottom: 1px solid var(--border);
box-shadow: 0 3px 14px rgba(20, 48, 32, .05);
}
.header-inner {
min-height: 78px; display: flex; align-items: center; justify-content: space-between;
gap: 22px; padding-top: 11px; padding-bottom: 11px;
}
.brand-lockup { display: flex; align-items: center; gap: 12px; min-width: 250px; }
.brand-logo { width: 46px; height: 46px; object-fit: contain; flex: none; }
.brand-copy { display: flex; flex-direction: column; line-height: 1.12; }
.brand-name {
font-family: "Quicksand", sans-serif; font-size: 25px; font-weight: 600;
letter-spacing: -.8px; color: var(--bk-gray);
}
.app-header h1 { margin: 4px 0 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.header-tools { display: flex; align-items: center; justify-content: flex-end; gap: 9px; }
.app-nav {
display: flex; gap: 5px; padding-top: 12px; padding-bottom: 0;
}
.nav-tab {
border: 0; border-radius: 11px; padding: 8px 15px; background: transparent;
color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
}
.nav-tab:hover { background: rgba(255,255,255,.72); color: var(--bk-gray); }
.nav-tab.active { background: var(--surface); color: var(--bk-green-007); box-shadow: var(--shadow-sm); }
/* Controls */
.btn, .input {
min-height: 42px; border: 1px solid var(--border); border-radius: 12px;
background: var(--surface); color: var(--text); font-size: 14px;
transition: border-color .16s ease, box-shadow .16s ease, background .16s ease, transform .16s ease;
}
.input { padding: 9px 13px; outline: none; }
.input:focus { border-color: var(--bk-green-005); box-shadow: 0 0 0 3px rgba(2, 215, 103, .13); }
#search { width: min(32vw, 310px); min-width: 210px; padding-left: 15px; }
.btn { padding: 9px 15px; cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--surface-soft); border-color: #ccd5d0; }
.btn:active { transform: translateY(1px); }
.btn-primary {
background: var(--bk-green); border-color: var(--bk-green); color: #11321f;
box-shadow: 0 5px 14px rgba(2, 215, 103, .22);
}
.btn-primary:hover { background: #00c95f; border-color: #00c95f; }
.btn-refresh { color: var(--bk-green-007); }
.btn-sheet { color: var(--bk-green-007); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
/* Feedback */
.banner { margin-top: 14px; padding-top: 10px; padding-bottom: 10px; border-radius: var(--radius); font-size: 14px; }
.banner.info { background: #e9fff3; color: var(--bk-green-007); border: 1px solid #c8f5dc; }
.banner.error { background: #fff0f0; color: #a52626; border: 1px solid #f4cccc; }
.banner.ok { background: #e6fff1; color: var(--bk-green-007); border: 1px solid #bcefd3; }
/* Category panel */
.category-panel {
margin-top: 18px; padding-top: 18px; padding-bottom: 18px;
background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
box-shadow: var(--shadow-sm);
}
.category-panel-head {
display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
margin-bottom: 13px;
}
.category-panel-head h2 { margin: 1px 0 0; font-size: 18px; line-height: 1.3; color: var(--bk-gray); }
.category-panel-head > p { margin: 0; font-size: 12px; color: var(--bk-gray-003); }
.eyebrow {
margin: 0; font-family: "Quicksand", sans-serif; font-size: 10px; font-weight: 700;
letter-spacing: 1.6px; color: var(--bk-green-007);
}
.category-wrap { width: 100%; }
.category-filters {
display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
overflow: visible; padding: 0;
}
.category-filter {
display: inline-flex; align-items: center; gap: 7px; flex: none;
min-height: 34px; border: 1px solid var(--border); background: var(--surface-soft); color: var(--bk-gray);
border-radius: 999px; padding: 5px 9px 5px 10px; font-size: 12px; font-weight: 500;
cursor: pointer; transition: background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
.category-filter:hover { border-color: #b8c8bf; background: #fff; transform: translateY(-1px); }
.category-filter.active {
background: #e7fff2; border-color: var(--bk-green-005); color: var(--bk-green-007);
box-shadow: 0 0 0 2px rgba(2, 215, 103, .10);
}
.category-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.category-count {
min-width: 23px; padding: 1px 6px; border-radius: 999px;
background: #e6ebe8; color: var(--muted); font-size: 10px; font-weight: 700; text-align: center;
}
.category-filter.active .category-count { background: var(--bk-green); color: #11321f; }
/* Production planning */
#productionsView { padding-top: 18px; padding-bottom: 40px; }
.section-toolbar, .detail-toolbar {
display: flex; align-items: center; justify-content: space-between; gap: 18px;
padding: 20px; background: var(--surface); border: 1px solid var(--border);
border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
}
.section-toolbar h2, .detail-toolbar h2 { margin: 2px 0 2px; color: var(--bk-gray); font-size: 21px; }
.section-toolbar p:not(.eyebrow), .detail-toolbar p { margin: 0; color: var(--muted); font-size: 12px; }
.production-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 14px; }
.production-card {
padding: 17px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--bk-green);
border-radius: var(--radius); box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .16s ease, box-shadow .16s ease;
}
.production-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.production-card.closed { border-left-color: var(--bk-gray-003); opacity: .82; }
.production-card-top { display: flex; justify-content: space-between; gap: 10px; }
.production-card h3 { margin: 0; font-size: 15px; color: var(--bk-gray); }
.production-card p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.job-status { display: inline-flex; padding: 3px 9px; border-radius: 999px; background: #e5fff1; color: var(--bk-green-007); font-size: 10px; font-weight: 700; }
.job-status.closed { background: #edf0ee; color: var(--muted); }
.job-badges { display: flex; align-items: center; gap: 7px; }
.save-state { color: var(--muted); font-size: 9px; }
.save-state.saving { color: #a77a00; }
.save-state.error { color: #b42323; }
.job-progress { margin-top: 14px; }
.job-progress-track { height: 6px; overflow: hidden; border-radius: 99px; background: #e8eeea; }
.job-progress-bar { height: 100%; border-radius: inherit; background: var(--bk-green); }
.job-progress-meta { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 10px; }
.empty-panel { grid-column: 1 / -1; padding: 50px 20px; border: 1px dashed #cbd5cf; border-radius: var(--radius-lg); background: rgba(255,255,255,.55); color: var(--muted); text-align: center; }
.detail-toolbar { align-items: flex-start; }
.detail-heading { min-width: 0; flex: 1; }
.detail-heading h2 { word-break: break-word; }
.detail-heading .job-note { margin-top: 5px; color: var(--bk-gray); font-size: 11px; white-space: pre-wrap; }
.detail-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.progress-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
.progress-card { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.progress-card span { display: block; color: var(--muted); font-size: 11px; }
.progress-card strong { display: block; margin-top: 2px; color: var(--bk-gray); font-family: "Quicksand", sans-serif; font-size: 25px; }
.progress-card.taken { border-top: 3px solid #007339; }
.progress-card.returned { border-top: 3px solid #02d767; }
.progress-card.missing { border-top: 3px solid #d73b3b; }
.job-checklist { display: flex; flex-direction: column; gap: 11px; }
.checklist-group { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.checklist-group-head { display: flex; align-items: center; gap: 9px; padding: 10px 14px; background: var(--surface-soft); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; }
.checklist-group-head .category-dot { width: 9px; height: 9px; }
.checklist-group-head span:last-child { margin-left: auto; color: var(--muted); font-size: 10px; }
.checklist-row { display: grid; grid-template-columns: minmax(200px, 1fr) 108px 108px 34px; align-items: center; gap: 9px; padding: 10px 14px; border-bottom: 1px solid #edf1ef; }
.checklist-row:last-child { border-bottom: 0; }
.checklist-info strong { display: block; color: var(--bk-gray); font-size: 12px; }
.checklist-info span { display: block; color: var(--muted); font-size: 10px; }
.checklist-info .checklist-unit-ids { margin-top: 2px; color: #929a95; font-family: "Quicksand", sans-serif; font-size: 9px; word-break: break-word; }
.check-control { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; cursor: pointer; }
.check-control input { width: 19px; height: 19px; accent-color: var(--bk-green-005); cursor: pointer; }
.check-control.return input { accent-color: var(--bk-green); }
.remove-checklist { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: #a52626; cursor: pointer; }
.remove-checklist:hover { background: #fff0f0; }
.modal-wide { max-width: 760px; }
.modal.modal-picker {
display: flex; flex-direction: column;
width: min(1180px, calc(100vw - 36px)); max-width: none;
height: min(860px, calc(100vh - 36px)); padding: 22px;
}
.picker-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.picker-head h2 { margin-top: 2px; }
.picker-heading-group { display: flex; align-items: flex-start; gap: 9px; }
.picker-back {
width: 34px; height: 34px; flex: none; margin-top: 3px; border: 1px solid var(--border);
border-radius: 10px; background: var(--surface-soft); color: var(--bk-green-007);
font-size: 18px; cursor: pointer;
}
.picker-back:hover { background: #e5f8ee; border-color: #b9ddca; }
.picker-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; flex: 1; min-height: 0; }
.picker-browser { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.picker-search { width: 100%; margin-bottom: 10px; }
.picker-help { margin: -3px 0 10px; color: var(--muted); font-size: 10px; }
.picker-list { display: flex; flex: 1; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 2px; }
.picker-category-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.picker-category-card {
display: grid; grid-template-columns: 46px 1fr 20px; align-items: center; gap: 11px;
min-height: 78px; padding: 12px; border: 1px solid var(--border); border-radius: 13px;
background: #fff; color: var(--text); text-align: left; cursor: pointer;
transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.picker-category-card:hover { transform: translateY(-1px); border-color: #a9d8bf; box-shadow: var(--shadow-sm); }
.picker-category-card.favorite { border-color: #e5d976; background: #fffef0; }
.picker-category-icon {
display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px;
background: color-mix(in srgb, var(--category) 13%, white); color: var(--category);
font-family: "Quicksand", sans-serif; font-size: 18px; font-weight: 700;
}
.picker-category-copy { min-width: 0; }
.picker-category-copy strong { display: block; overflow: hidden; color: var(--bk-gray); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.picker-category-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.4; }
.picker-category-arrow { color: var(--bk-green-007); font-family: "Quicksand", sans-serif; font-size: 24px; text-align: right; }
.picker-section { overflow: hidden; flex: none; border: 1px solid var(--border); border-radius: 13px; background: #fff; }
.picker-category {
display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #eaf7f0;
color: var(--bk-green-007); font-size: 11px; font-weight: 700; position: sticky; top: 0; z-index: 1;
border-bottom: 1px solid #d8ebe1;
}
.picker-category > span:last-child { margin-left: auto; padding: 2px 7px; border-radius: 999px; background: #fff; color: var(--muted); font-size: 9px; }
.picker-category-body { display: flex; flex-direction: column; }
.picker-item { display: grid; grid-template-columns: 24px 1fr 34px auto; align-items: center; gap: 9px; padding: 9px 11px; border-bottom: 1px solid #edf1ef; cursor: pointer; }
.picker-item:last-child { border-bottom: 0; }
.picker-item:hover { background: #f8fcfa; }
.picker-item input { width: 18px; height: 18px; accent-color: var(--bk-green-005); }
.picker-item strong { display: block; font-size: 12px; }
.picker-item span { display: block; color: var(--muted); font-size: 10px; }
.picker-status { padding: 2px 7px; border-radius: 999px; background: #eef1ef; color: var(--muted); font-size: 9px; }
.picker-bulk { display: grid; grid-template-columns: 1fr 34px auto; align-items: center; gap: 10px; padding: 11px; border-bottom: 1px solid #edf1ef; background: #fbfdfc; }
.picker-bulk:last-child { border-bottom: 0; }
.picker-bulk-info strong { display: block; color: var(--bk-gray); font-size: 12px; }
.picker-bulk-info span { display: block; color: var(--muted); font-size: 10px; }
.picker-bulk-info .picker-availability { margin-top: 2px; color: var(--bk-green-007); }
.qty-stepper { display: grid; grid-template-columns: 32px 38px 32px; align-items: center; overflow: hidden; border: 1px solid #cfd9d3; border-radius: 10px; background: #fff; }
.qty-stepper button { width: 32px; height: 34px; border: 0; background: #eff8f3; color: var(--bk-green-007); font-size: 18px; cursor: pointer; }
.qty-stepper button:hover:not(:disabled) { background: #dff5e9; }
.qty-stepper button:disabled { color: #c3cbc6; cursor: default; }
.qty-stepper strong { text-align: center; color: var(--bk-gray); font-family: "Quicksand", sans-serif; font-size: 13px; }
.favorite-btn { width: 32px; height: 32px; border: 0; border-radius: 9px; background: #f2f4f3; color: #aeb5b1; font-size: 20px; line-height: 1; cursor: pointer; }
.favorite-btn:hover { background: #fff9cf; color: #b29a00; }
.favorite-btn.active { background: #fff8bd; color: #c4a800; }
.picker-selection-panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: #f7faf8; }
.picker-selection-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px; border-bottom: 1px solid var(--border); background: #eef7f2; }
.picker-selection-head h3 { margin: 2px 0 0; color: var(--bk-gray); font-size: 14px; }
.picker-selection-head > strong { min-width: 30px; padding: 3px 8px; border-radius: 999px; background: var(--bk-green); color: #11321f; font-family: "Quicksand", sans-serif; font-size: 11px; text-align: center; }
.picker-selected-list { display: flex; flex-direction: column; gap: 7px; flex: 1; min-height: 0; overflow-y: auto; padding: 9px; }
.picker-selected-empty { display: grid; place-items: center; min-height: 150px; color: var(--muted); font-size: 11px; text-align: center; }
.picker-selected-item { display: grid; grid-template-columns: 9px 1fr 28px; align-items: center; gap: 8px; padding: 9px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
.picker-selected-item strong { display: block; color: var(--bk-gray); font-size: 10px; line-height: 1.35; }
.picker-selected-item span:not(.category-dot) { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
.picker-selected-item button { width: 27px; height: 27px; border: 0; border-radius: 8px; background: transparent; color: #a52626; font-size: 16px; cursor: pointer; }
.picker-selected-item button:hover { background: #fff0f0; }
.modal-picker > .modal-actions { flex: none; margin-top: 12px; }
.stack-form label, #unitForm label { display: block; margin-bottom: 13px; color: var(--muted); font-size: 12px; font-weight: 500; }
.stack-form .input, #unitForm .input { display: block; width: 100%; margin-top: 5px; color: var(--text); }
.stack-form .row { display: flex; gap: 12px; }
.stack-form .row label { flex: 1; }
.form-help { margin: -2px 0 15px; padding: 10px 12px; border-radius: 10px; background: #f1f7f4; color: var(--muted); font-size: 10px; line-height: 1.55; }
/* Board */
.board-scroll { overflow-x: auto; padding: 14px 22px 8px; }
.board {
display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr));
gap: 12px; min-width: 980px; width: min(100%, 1440px); margin: 0 auto;
}
.column {
display: flex; flex-direction: column; height: min(61vh, 680px); min-height: 470px;
overflow: hidden; background: #e9eeeb; border: 1px solid #dfe6e2; border-radius: 18px;
}
.col-head {
display: flex; align-items: center; gap: 9px; flex: none;
padding: 13px 14px 11px; font-size: 13px; font-weight: 700; color: var(--bk-gray);
background: rgba(255,255,255,.34); border-bottom: 1px solid rgba(64,64,64,.06);
}
.col-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 4px rgba(255,255,255,.5); }
.col-head .count {
margin-left: auto; min-width: 30px; padding: 2px 8px; border-radius: 999px;
background: rgba(64,64,64,.08); color: var(--muted); font-size: 11px; text-align: center;
}
.col-body {
flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
padding: 9px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
scrollbar-color: #c7d1cb transparent; transition: background .12s ease;
}
.col-body.drop-hover { background: rgba(2,215,103,.11); outline: 2px dashed var(--bk-green-005); outline-offset: -5px; }
.col-empty { color: var(--bk-gray-003); font-size: 12px; text-align: center; padding: 24px 0; }
/* Equipment cards */
.card {
--category: var(--bk-green-007);
position: relative; background: var(--surface); border: 1px solid rgba(64,64,64,.08);
border-top: 3px solid var(--accent, var(--bk-green));
border-left: 4px solid var(--category);
border-radius: 12px; padding: 9px 10px; box-shadow: var(--shadow-sm);
cursor: grab; user-select: none; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: rgba(0,115,57,.18); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: .45; transform: rotate(1deg); }
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.card-name { flex: 1; font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--bk-gray); word-break: break-word; }
.card-menu-btn {
width: 25px; height: 25px; flex: none; border: 0; border-radius: 8px;
background: transparent; color: var(--bk-gray-003); cursor: pointer; font-size: 17px; line-height: 1;
}
.card-menu-btn:hover { background: #eef3f0; color: var(--bk-gray); }
.card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.qty-badge {
background: var(--accent, var(--bk-green)); color: #fff;
border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700;
}
.card-cat {
color: var(--category, var(--bk-green-007));
background: color-mix(in srgb, var(--category) 10%, white);
border: 1px solid color-mix(in srgb, var(--category) 18%, white);
border-radius: 999px; padding: 1px 7px; font-size: 10px; font-weight: 600;
}
.units { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
.unit {
display: flex; align-items: center; gap: 7px; padding: 6px 8px;
background: var(--surface-soft); border: 1px solid var(--border); border-radius: 8px;
font-size: 11px; cursor: grab;
}
.unit:active { cursor: grabbing; }
.unit.dragging { opacity: .45; }
.u-detail { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.unit .u-label { color: var(--text); font-weight: 600; word-break: break-word; }
.unit .u-sub { overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.unit .u-edit {
border: 0; border-radius: 7px; padding: 3px 6px; background: #e8fff3;
color: var(--bk-green-007); font-size: 9px; font-weight: 600; cursor: pointer;
}
.unit .u-edit:hover { background: #ccf8df; }
.unit .u-del { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.unit .u-del:hover { color: #b42323; }
