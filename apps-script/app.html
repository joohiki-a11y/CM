<script>
/* CM UI v5: Bitkub CI + Unit Details */
/* ==================================================================
บอร์ดอุปกรณ์สตูดิโอ — Kanban (drag ซ้าย→ขวา เปลี่ยนสถานะ)
- แต่ละ "ชิ้น" ของอุปกรณ์ = 1 record ในชีต
- อุปกรณ์ชื่อเดียวกันในคอลัมน์เดียวกัน = รวมเป็นการ์ดเดียว (โชว์จำนวน)
- คลิกการ์ด = กางดูอุปกรณ์แต่ละชิ้น (ลากทีละชิ้นได้)
================================================================== */
(function () {
"use strict";
const CFG = window.APP_CONFIG || {};
const STATUSES = CFG.STATUSES || [];
const STATUS_MAP = Object.fromEntries(STATUSES.map((s) => [s.key, s]));
const $ = (id) => document.getElementById(id);
const board = $("board");
const banner = $("banner");
const popMenu = $("popMenu");
let items = []; // ทุกชิ้น (units)
let selectedCategory = "__all__"; // หมวดหมู่ที่กำลังแสดง
const expanded = new Set(); // groupKey ที่กางอยู่
let drag = null; // { ids:[...], fromStatus }
let currentView = "inventory";
let productions = [];
let currentProduction = null;
let productionFormMode = "create";
let selectableUnits = [];
let pickerSelection = new Set();
let pickerCategory = null;
const pendingChecklistUpdates = new Map();
let checklistSyncTimer = null;
let checklistSyncInFlight = false;
let checklistSyncPromise = null;
// ================================================================
function init() {
$("studioName").textContent = CFG.STUDIO_NAME || "บอร์ดอุปกรณ์สตูดิโอ";
document.title = CFG.STUDIO_NAME || "บอร์ดอุปกรณ์สตูดิโอ";
$("openSheetBtn").href = CFG.SHEET_URL || "#";
for (const s of STATUSES) {
$("f_status").appendChild(new Option(s.label, s.key));
$("u_status").appendChild(new Option(s.label, s.key));
}
$("addBtn").addEventListener("click", () => openForm());
$("refreshBtn").addEventListener("click", () => {
if (currentView === "inventory") return loadData(true);
return currentProduction ? openProduction(currentProduction.job.id) : loadProductions();
});
$("cancelBtn").addEventListener("click", closeForm);
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeForm(); });
$("equipForm").addEventListener("submit", onSubmit);
$("unitCancelBtn").addEventListener("click", closeUnitForm);
$("unitModal").addEventListener("click", (e) => { if (e.target.id === "unitModal") closeUnitForm(); });
$("unitForm").addEventListener("submit", onUnitSubmit);
$("search").addEventListener("input", render);
$("inventoryTab").addEventListener("click", () => showView("inventory"));
$("productionsTab").addEventListener("click", () => showView("productions"));
$("createProductionBtn").addEventListener("click", openProductionForm);
$("editProductionBtn").addEventListener("click", openProductionEditForm);
$("copyProductionBtn").addEventListener("click", openCopyProductionForm);
$("productionCancelBtn").addEventListener("click", closeProductionForm);
$("productionModal").addEventListener("click", (e) => { if (e.target.id === "productionModal") closeProductionForm(); });
$("productionForm").addEventListener("submit", onProductionSubmit);
$("copyProductionCancelBtn").addEventListener("click", closeCopyProductionForm);
$("copyProductionModal").addEventListener("click", (e) => { if (e.target.id === "copyProductionModal") closeCopyProductionForm(); });
$("copyProductionForm").addEventListener("submit", onCopyProductionSubmit);
$("backToProductionsBtn").addEventListener("click", () => { showProductionHome(); loadProductions(); });
$("shareJobBtn").addEventListener("click", copyProductionLink);
$("addJobEquipmentBtn").addEventListener("click", openUnitPicker);
$("closeJobBtn").addEventListener("click", toggleProductionClosed);
$("pickerCancelBtn").addEventListener("click", closeUnitPicker);
$("pickerBackBtn").addEventListener("click", () => {
pickerCategory = null;
$("pickerSearch").value = "";
renderUnitPicker();
});
$("unitPickerModal").addEventListener("click", (e) => { if (e.target.id === "unitPickerModal") closeUnitPicker(); });
$("pickerSearch").addEventListener("input", renderUnitPicker);
$("pickerAddBtn").addEventListener("click", addSelectedUnits);
document.addEventListener("click", closePopMenu);
window.addEventListener("scroll", closePopMenu, true);
if (window.INITIAL_JOB_ID) {
showView("productions", false);
openProduction(window.INITIAL_JOB_ID);
} else {
loadData();
}
}
// ================================================================
// API
// ================================================================
function api(action, payload = {}) {
return new Promise((resolve, reject) => {
if (!window.google || !google.script || !google.script.run) {
reject(new Error("หน้านี้ต้องเปิดผ่าน Google Apps Script Web App"));
return;
}
const runner = google.script.run
.withSuccessHandler(resolve)
.withFailureHandler((err) => reject(new Error(err && err.message ? err.message : String(err))));
if (action === "list") return runner.listItems();
if (action === "refreshList") return runner.refreshItemsFromMaster();
if (action === "add") return runner.addItem(
payload.item,
payload.status || (payload.item && payload.item.status),
payload.count
);
if (action === "move") return runner.moveUnits(payload.ids, payload.status);
if (action === "updateGroup") return runner.updateGroup(payload.ids, payload.fields);
if (action === "updateUnit") return runner.updateUnit(payload.id, payload.fields);
if (action === "delete") return runner.deleteUnits([payload.id]);
if (action === "deleteGroup") return runner.deleteUnits(payload.ids);
if (action === "listProductions") return runner.listProductions();
if (action === "createProduction") return runner.createProduction(payload.data);
if (action === "updateProduction") return runner.updateProduction(payload.jobId, payload.data);
if (action === "getProduction") return runner.getProduction(payload.jobId);
if (action === "listProductionUnitOptions") return runner.listProductionUnitOptions(payload.jobId);
if (action === "setEquipmentFavorite") return runner.setEquipmentFavorite(payload.equipmentId, payload.value);
if (action === "addProductionUnits") return runner.addProductionUnits(payload.jobId, payload.unitIds);
if (action === "copyProductionItems") return runner.copyProductionItems(payload.targetJobId, payload.sourceJobId);
if (action === "removeProductionUnit") return runner.removeProductionUnit(payload.jobId, payload.unitId);
if (action === "removeProductionUnits") return runner.removeProductionUnits(payload.jobId, payload.unitIds);
if (action === "setChecklistState") return runner.setChecklistState(payload.jobId, payload.unitId, payload.field, payload.value);
if (action === "setChecklistStates") return runner.setChecklistStates(payload.jobId, payload.updates);
if (action === "closeProduction") return runner.closeProduction(payload.jobId);
if (action === "reopenProduction") return runner.reopenProduction(payload.jobId);
reject(new Error("ไม่รู้จักคำสั่ง: " + action));
});
}
async function loadData(syncMaster = false) {
showBanner(syncMaster ? "กำลังซิงก์ข้อมูลจากชีต…" : "กำลังโหลดข้อมูล…", "info");
try {
if (syncMaster) {
const result = await api("refreshList");
items = (result && result.items) || [];
if (result && result.syncWarning) {
showBanner("โหลดข้อมูลแล้ว แต่ซิงก์จากชีตไม่สำเร็จ: " + result.syncWarning, "error");
} else {
hideBanner();
}
} else {
items = await api("list");
hideBanner();
}
buildCategoryList();
buildCategoryFilters();
render();
} catch (err) {
showBanner("โหลดข้อมูลไม่สำเร็จ: " + err.message, "error");
}
}
// ================================================================
// จัดกลุ่ม + แสดงผลบอร์ด
// ================================================================
function groupKey(status, name) { return status + "||" + (name || "").trim().toLowerCase(); }
function normalizedCategory(value) {
return (value || "ไม่มีหมวดหมู่").trim() || "ไม่มีหมวดหมู่";
}
const CATEGORY_COLORS = [
"#007339", "#00bf61", "#02d767", "#77c900",
"#a3ed24", "#507b62", "#404040", "#969696"
];
function categoryColor(category) {
const text = normalizedCategory(category);
let hash = 0;
for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
return CATEGORY_COLORS[Math.abs(hash) % CATEGORY_COLORS.length];
}
function render() {
const q = $("search").value.trim().toLowerCase();
board.innerHTML = "";
for (const st of STATUSES) {
const colUnits = items.filter(
(it) => it.status === st.key &&
(selectedCategory === "__all__" || normalizedCategory(it.category) === selectedCategory) &&
(!q || (it.name || "").toLowerCase().includes(q))
);
// จัดกลุ่มตามชื่อ
const groups = new Map();
for (const it of colUnits) {
const k = groupKey(st.key, it.name);
if (!groups.has(k)) groups.set(k, []);
groups.get(k).push(it);
}
// ตัวเลขบนหัวคอลัมน์นับจำนวนชนิด (จำนวนการ์ด) ไม่ใช่จำนวนชิ้น
board.appendChild(renderColumn(st, groups, groups.size));
}
}
function renderColumn(st, groups, total) {
const col = document.createElement("div");
col.className = "column";
const head = document.createElement("div");
head.className = "col-head";
head.innerHTML =
`<span class="dot" style="background:${st.color}"></span>` +
`<span>${st.label}</span>` +
`<span class="count">${total}</span>`;
col.appendChild(head);
const body = document.createElement("div");
body.className = "col-body";
body.dataset.status = st.key;
// drop target
body.addEventListener("dragover", (e) => { e.preventDefault(); body.classList.add("drop-hover"); });
body.addEventListener("dragleave", () => body.classList.remove("drop-hover"));
body.addEventListener("drop", (e) => {
e.preventDefault();
body.classList.remove("drop-hover");
if (drag && drag.fromStatus !== st.key) moveUnits(drag.ids, st.key);
drag = null;
});
if (groups.size === 0) {
const empty = document.createElement("div");
empty.className = "col-empty";
empty.textContent = "— ว่าง —";
body.appendChild(empty);
} else {
// เรียงตามชื่อ
const sorted = [...groups.entries()].sort((a, b) =>
(a[1][0].name || "").localeCompare(b[1][0].name || "", "th")
);
for (const [key, units] of sorted) body.appendChild(renderCard(st, key, units));
}
col.appendChild(body);
return col;
}
function renderCard(st, key, units) {
const first = units[0];
const card = document.createElement("div");
card.className = "card";
card.style.setProperty("--accent", st.color);
card.style.setProperty("--category", categoryColor(first.category));
card.draggable = true;
const ids = units.map((u) => u.id);
// ลากทั้งการ์ด = ย้ายทั้งกลุ่ม
card.addEventListener("dragstart", (e) => {
drag = { ids, fromStatus: st.key };
card.classList.add("dragging");
e.dataTransfer.effectAllowed = "move";
e.dataTransfer.setData("text/plain", key);
});
card.addEventListener("dragend", () => card.classList.remove("dragging"));
// ส่วนหัวการ์ด
const top = document.createElement("div");
top.className = "card-top";
const name = document.createElement("div");
name.className = "card-name";
name.textContent = first.name || "(ไม่มีชื่อ)";
const menuBtn = document.createElement("button");
menuBtn.className = "card-menu-btn";
menuBtn.textContent = "⋮";
menuBtn.title = "ตัวเลือก";
menuBtn.addEventListener("click", (e) => { e.stopPropagation(); openCardMenu(e, st, units); });
top.append(name, menuBtn);
const meta = document.createElement("div");
meta.className = "card-meta";
const badge = document.createElement("span");
badge.className = "qty-badge";
badge.textContent = units.length + " ชิ้น";
meta.appendChild(badge);
if (first.category) {
const cat = document.createElement("span");
cat.className = "card-cat";
cat.textContent = first.category;
cat.style.setProperty("--category", categoryColor(first.category));
meta.appendChild(cat);
}
card.append(top, meta);
// คลิกการ์ด = กาง/พับ รายชิ้น
card.addEventListener("click", () => {
if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
render();
});
if (expanded.has(key)) card.appendChild(renderUnits(st, units));
return card;
}
function renderUnits(st, units) {
const box = document.createElement("div");
box.className = "units";
units.forEach((u, i) => {
const row = document.createElement("div");
row.className = "unit";
row.draggable = true;
row.addEventListener("dragstart", (e) => {
e.stopPropagation();
drag = { ids: [u.id], fromStatus: st.key };
row.classList.add("dragging");
e.dataTransfer.effectAllowed = "move";
e.dataTransfer.setData("text/plain", u.id);
});
row.addEventListener("dragend", () => row.classList.remove("dragging"));
const detail = document.createElement("div");
detail.className = "u-detail";
const label = document.createElement("span");
label.className = "u-label";
label.textContent = u.serial || u.id;
const sub = document.createElement("span");
sub.className = "u-sub";
sub.textContent = [u.id, u.location].filter(Boolean).join(" · ");
detail.append(label, sub);
const edit = document.createElement("button");
edit.className = "u-edit";
edit.textContent = "แก้ไข";
edit.title = "แก้ไข S/N และรายละเอียดรายชิ้น";
edit.addEventListener("click", (e) => { e.stopPropagation(); openUnitForm(u); });
const del = document.createElement("button");
del.className = "u-del";
del.textContent = "×";
del.title = "ลบชิ้นนี้";
del.addEventListener("click", (e) => { e.stopPropagation(); deleteUnit(u); });
// คลิกชิ้น = เมนูย้าย
row.addEventListener("click", (e) => {
if (e.target === del || e.target === edit) return;
e.stopPropagation();
openUnitMenu(e, st, u);
});
row.append(detail, edit, del);
box.appendChild(row);
});
return box;
}
function renderBoardSkeleton() {
board.innerHTML = "";
for (const st of STATUSES) board.appendChild(renderColumn(st, new Map(), 0));
}
// ================================================================
// เมนูป๊อปอัป
// ================================================================
function openPopMenu(e, options) {
closePopMenu();
popMenu.innerHTML = "";
for (const opt of options) {
if (opt.sep) { const s = document.createElement("div"); s.className = "sep"; popMenu.appendChild(s); continue; }
const b = document.createElement("button");
if (opt.color) b.innerHTML = `<span class="dot" style="background:${opt.color}"></span>`;
b.appendChild(document.createTextNode(opt.label));
if (opt.danger) b.classList.add("danger");
b.addEventListener("click", (ev) => { ev.stopPropagation(); closePopMenu(); opt.onClick(); });
popMenu.appendChild(b);
}
popMenu.hidden = false;
const mw = popMenu.offsetWidth, mh = popMenu.offsetHeight;
let x = e.clientX, y = e.clientY;
if (x + mw > window.innerWidth - 8) x = window.innerWidth - mw - 8;
if (y + mh > window.innerHeight - 8) y = window.innerHeight - mh - 8;
popMenu.style.left = (window.scrollX + x) + "px";
popMenu.style.top = (window.scrollY + y) + "px";
}
function closePopMenu() { popMenu.hidden = true; }
function openCardMenu(e, st, units) {
const ids = units.map((u) => u.id);
const opts = [];
for (const s of STATUSES) {
if (s.key === st.key) continue;
opts.push({ label: "ย้ายทั้งกลุ่มไป “" + s.label + "”", color: s.color, onClick: () => moveUnits(ids, s.key) });
}
opts.push({ sep: true });
opts.push({ label: "แก้ไขข้อมูล", onClick: () => openForm(units) });
opts.push({ label: "ลบทั้งกลุ่ม (" + units.length + " ชิ้น)", danger: true, onClick: () => deleteGroup(units) });
openPopMenu(e, opts);
}
function openUnitMenu(e, st, u) {
const opts = [];
opts.push({ label: "แก้ไข S/N / รายละเอียด", onClick: () => openUnitForm(u) });
opts.push({ sep: true });
for (const s of STATUSES) {
if (s.key === st.key) continue;
opts.push({ label: "ย้ายชิ้นนี้ไป “" + s.label + "”", color: s.color, onClick: () => moveUnits([u.id], s.key) });
}
opts.push({ sep: true });
opts.push({ label: "ลบชิ้นนี้", danger: true, onClick: () => deleteUnit(u) });
openPopMenu(e, opts);
}
// ================================================================
// การกระทำ (ย้าย / เพิ่ม / แก้ / ลบ)
// ================================================================
async function moveUnits(ids, newStatus) {
const idSet = new Set(ids);
const affected = items.filter((it) => idSet.has(it.id));
const prev = affected.map((it) => it.status);
affected.forEach((it) => (it.status = newStatus)); // optimistic
render();
try {
await api("move", { ids, status: newStatus });
} catch (err) {
affected.forEach((it, i) => (it.status = prev[i])); // rollback
render();
showBanner("ย้ายไม่สำเร็จ: " + err.message, "error");
}
}
function openForm(units) {
const editing = Array.isArray(units) && units.length > 0;
const first = editing ? units[0] : null;
$("modalTitle").textContent = editing ? "แก้ไขข้อมูลกลุ่ม" : "เพิ่มอุปกรณ์";
$("f_ids").value = editing ? units.map((u) => u.id).join(",") : "";
$("f_name").value = editing ? first.name || "" : "";
$("f_category").value = editing ? first.category || "" : "";
$("f_location").value = editing ? first.location || "" : "";
$("f_note").value = editing ? first.note || "" : "";
$("f_status").value = editing ? first.status : STATUSES[0]?.key;
$("f_count").value = 1;
// แก้ไขกลุ่ม: ซ่อนช่องจำนวน + สถานะเริ่มต้น (ย้ายสถานะทำจากบอร์ด)
$("countWrap").style.display = editing ? "none" : "";
$("statusWrap").style.display = editing ? "none" : "";
$("modal").hidden = false;
$("f_name").focus();
}
function closeForm() { $("modal").hidden = true; }
function openUnitForm(unit) {
$("u_id").value = unit.id;
$("u_unit_id").textContent = unit.id;
$("u_name").value = unit.name || "";
$("u_serial").value = unit.serial || "";
$("u_status").value = unit.status || STATUSES[0]?.key;
$("u_location").value = unit.location || "";
$("u_note").value = unit.note || "";
$("unitModal").hidden = false;
$("u_serial").focus();
}
function closeUnitForm() { $("unitModal").hidden = true; }
async function onUnitSubmit(e) {
e.preventDefault();
const button = $("unitSaveBtn");
button.disabled = true;
try {
await api("updateUnit", {
id: $("u_id").value,
fields: {
serial: $("u_serial").value.trim(),
status: $("u_status").value,
location: $("u_location").value.trim(),
note: $("u_note").value.trim(),
},
});
closeUnitForm();
await loadData();
showBanner("บันทึกรายละเอียดรายชิ้นแล้ว", "ok");
setTimeout(hideBanner, 1800);
} catch (err) {
showBanner("บันทึกรายชิ้นไม่สำเร็จ: " + err.message, "error");
} finally {
button.disabled = false;
}
}
async function onSubmit(e) {
e.preventDefault();
const saveBtn = $("saveBtn");
saveBtn.disabled = true;
const idsRaw = $("f_ids").value;
const fields = {
name: $("f_name").value.trim(),
category: $("f_category").value.trim(),
location: $("f_location").value.trim(),
note: $("f_note").value.trim(),
};
try {
if (idsRaw) {
const ids = idsRaw.split(",");
await api("updateGroup", { ids, fields });
} else {
const count = Math.max(1, Number($("f_count").value) || 1);
await api("add", { item: fields, status: $("f_status").value, count });
}
closeForm();
await loadData();
showBanner("บันทึกเรียบร้อย", "ok");
setTimeout(hideBanner, 1800);
} catch (err) {
showBanner("บันทึกไม่สำเร็จ: " + err.message, "error");
} finally {
saveBtn.disabled = false;
}
}
async function deleteUnit(u) {
if (!confirm(`ลบ "${u.name}" 1 ชิ้น ใช่หรือไม่?`)) return;
try { await api("delete", { id: u.id }); await loadData(); }
catch (err) { showBanner("ลบไม่สำเร็จ: " + err.message, "error"); }
}
async function deleteGroup(units) {
if (!confirm(`ลบ "${units[0].name}" ทั้งหมด ${units.length} ชิ้น ใช่หรือไม่?`)) return;
try { await api("deleteGroup", { ids: units.map((u) => u.id) }); await loadData(); }
catch (err) { showBanner("ลบไม่สำเร็จ: " + err.message, "error"); }
}
// ================================================================
// เตรียมอุปกรณ์ออกกอง + Checklist รับคืน
// ================================================================
function showView(view, shouldLoad = true) {
currentView = view;
const inventory = view === "inventory";
$("inventoryView").hidden = !inventory;
$("productionsView").hidden = inventory;
$("inventoryTab").classList.toggle("active", inventory);
$("productionsTab").classList.toggle("active", !inventory);
$("search").hidden = !inventory;
$("addBtn").hidden = !inventory;
if (inventory) {
if (shouldLoad && !items.length) loadData();
} else if (shouldLoad) {
showProductionHome();
loadProductions();
}
}
async function loadProductions() {
showBanner("กำลังโหลดรายการออกกอง…", "info");
try {
productions = await api("listProductions");
renderProductions();
hideBanner();
} catch (err) {
showBanner("โหลดรายการออกกองไม่สำเร็จ: " + err.message, "error");
}
}
function renderProductions() {
const host = $("productionList");
host.innerHTML = "";
if (!productions.length) {
const empty = document.createElement("div");
empty.className = "empty-panel";
empty.textContent = "ยังไม่มีรายการออกกอง กด “สร้างกองใหม่” เพื่อเริ่มใช้งาน";
host.appendChild(empty);
return;
}
productions.forEach((job) => {
const card = document.createElement("article");
card.className = "production-card" + (job.status === "closed" ? " closed" : "");
const top = document.createElement("div");
top.className = "production-card-top";
const title = document.createElement("h3");
title.textContent = job.title;
const badge = document.createElement("span");
badge.className = "job-status" + (job.status === "closed" ? " closed" : "");
badge.textContent = job.status === "closed" ? "ปิดกองแล้ว" : "กำลังเตรียม";
top.append(title, badge);
const meta = document.createElement("p");
meta.textContent = [job.shootDate, job.location, job.owner].filter(Boolean).join(" · ") || job.id;
const progress = document.createElement("div");
progress.className = "job-progress";
const percent = job.totalCount ? Math.round((job.returnedCount / job.totalCount) * 100) : 0;
progress.innerHTML = `<div class="job-progress-track"><div class="job-progress-bar" style="width:${percent}%"></div></div>` +
`<div class="job-progress-meta"><span>${job.totalCount} ชิ้น</span><span>รับกลับ ${job.returnedCount}/${job.totalCount}</span></div>`;
card.append(top, meta, progress);

async function flushChecklistUpdates() {

const jobId = currentProduction.job.id;
const updates = [...pendingChecklistUpdates.values()];
pendingChecklistUpdates.clear();
checklistSyncInFlight = true;

if (currentProduction && currentProduction.job.id === jobId) {
currentProduction = saved;

if (queuedAfterSave.length) applyChecklistUpdatesLocally(queuedAfterSave);
recalculateProductionStats();
renderProductionDetail();
}
updateChecklistSaveState(pendingChecklistUpdates.size ? "saving" : "saved");
} catch (err) {
updateChecklistSaveState("error");
showBanner("บันทึก Checklist ไม่สำเร็จ กำลังโหลดสถานะล่าสุด: " + err.message, "error");
pendingChecklistUpdates.clear();
if (currentProduction && currentProduction.job.id === jobId) {

}
} finally {

}
})();

}

event.preventDefault();
event.stopPropagation();
toggleEquipmentFavorite(equipmentId, !button.classList.contains("active"));
});
return button;
}
async function toggleEquipmentFavorite(equipmentId, value) {
selectableUnits.forEach((unit) => {
if (unit.equipmentId === equipmentId) unit.favorite = value;
});
renderUnitPicker();
try {
await api("setEquipmentFavorite", { equipmentId, value });
} catch (err) {
selectableUnits.forEach((unit) => {
if (unit.equipmentId === equipmentId) unit.favorite = !value;
});
renderUnitPicker();
showBanner("บันทึกรายการโปรดไม่สำเร็จ: " + err.message, "error");
}
}
function updatePickerCount() {
const count = pickerSelection.size;
$("pickerCount").textContent = "เลือก " + count + " ชิ้น";
$("pickerSelectedCount").textContent = count;
$("pickerAddBtn").disabled = count === 0;
renderPickerSelection();
}
function renderPickerSelection() {
const host = $("pickerSelectedList");
host.innerHTML = "";
const selectedUnits = selectableUnits.filter((unit) => pickerSelection.has(unit.id));
if (!selectedUnits.length) {
const empty = document.createElement("div");
empty.className = "picker-selected-empty";
empty.textContent = "ยังไม่ได้เลือกอุปกรณ์";
host.appendChild(empty);
return;
}
const displayGroups = [];
const bulkGroups = new Map();
selectedUnits.forEach((unit) => {
if (String(unit.serial || "").trim()) {
displayGroups.push([unit]);
} else {
const key = unit.equipmentId || unit.name;
if (!bulkGroups.has(key)) bulkGroups.set(key, []);
bulkGroups.get(key).push(unit);
}
});
bulkGroups.forEach((group) => displayGroups.push(group));
displayGroups.sort((a, b) => a[0].name.localeCompare(b[0].name, "th")).forEach((group) => {
const first = group[0];
const card = document.createElement("div");
card.className = "picker-selected-item";
const marker = document.createElement("span");
marker.className = "category-dot";
marker.style.background = categoryColor(normalizedCategory(first.category));
const copy = document.createElement("div");
const title = document.createElement("strong");
title.textContent = first.name + (!first.serial ? ` · ${group.length} ชิ้น` : "");
const meta = document.createElement("span");
meta.textContent = first.serial
? [first.category, "S/N " + first.serial, first.id].filter(Boolean).join(" · ")
: [first.category, "ไม่มี S/N"].filter(Boolean).join(" · ");
copy.append(title, meta);
const remove = document.createElement("button");
remove.type = "button";
remove.title = "นำออกจากรายการที่เลือก";
remove.textContent = "×";
remove.addEventListener("click", () => {
group.forEach((unit) => pickerSelection.delete(unit.id));
renderUnitPicker();
});
card.append(marker, copy, remove);
host.appendChild(card);
});
}
async function addSelectedUnits() {
const unitIds = [...pickerSelection];
if (!unitIds.length) return;
const button = $("pickerAddBtn");
button.disabled = true;
try {
currentProduction = await api("addProductionUnits", { jobId: currentProduction.job.id, unitIds });
closeUnitPicker();
renderProductionDetail();
} catch (err) {
showBanner("เพิ่มอุปกรณ์ไม่สำเร็จ: " + err.message, "error");
} finally {
button.disabled = false;
}
}
async function removeProductionUnits(itemGroup) {
const first = itemGroup[0];
if (!confirm(`นำ “${first.name}” ${itemGroup.length} ชิ้น ออกจากรายการนี้ใช่หรือไม่?`)) return;
try {
currentProduction = await api("removeProductionUnits", {
jobId: currentProduction.job.id, unitIds: itemGroup.map((item) => item.unitId)
});
renderProductionDetail();
} catch (err) {
showBanner("นำรายการออกไม่สำเร็จ: " + err.message, "error");
}
}
async function toggleProductionClosed() {
if (!currentProduction) return;
await savePendingChecklistNow();
const job = currentProduction.job;
if (job.status !== "closed" && !confirm("ปิดกองนี้หลังตรวจรับอุปกรณ์ครบแล้วใช่หรือไม่?")) return;
try {
currentProduction = await api(job.status === "closed" ? "reopenProduction" : "closeProduction", { jobId: job.id });
renderProductionDetail();
productions = await api("listProductions");
renderProductions();
} catch (err) {
showBanner("เปลี่ยนสถานะกองไม่สำเร็จ: " + err.message, "error");
}
}
async function copyProductionLink() {
if (!currentProduction) return;
const url = currentProduction.shareUrl;
try {
await navigator.clipboard.writeText(url);
showBanner("คัดลอกลิงก์กองแล้ว", "ok");
setTimeout(hideBanner, 1800);
} catch (err) {
window.prompt("คัดลอกลิงก์นี้", url);
}
}
// ================================================================
// Helpers
// ================================================================
function buildCategoryList() {
const cats = [...new Set(items.map((it) => it.category).filter(Boolean))].sort();
const dl = $("categoryList");
dl.innerHTML = "";
for (const c of cats) dl.appendChild(new Option(c));
}
function buildCategoryFilters() {
const host = $("categoryFilters");
const typesByCategory = new Map();
const allTypes = new Set();
for (const item of items) {
const category = normalizedCategory(item.category);
const typeKey = category + "||" + (item.name || "").trim().toLowerCase();
if (!typesByCategory.has(category)) typesByCategory.set(category, new Set());
typesByCategory.get(category).add(typeKey);
allTypes.add(typeKey);
}
const categories = [...typesByCategory.keys()].sort((a, b) => a.localeCompare(b, "th"));
if (selectedCategory !== "__all__" && !typesByCategory.has(selectedCategory)) selectedCategory = "__all__";
host.innerHTML = "";
const addFilter = (value, label, count, color) => {
const button = document.createElement("button");
button.type = "button";
button.className = "category-filter" + (selectedCategory === value ? " active" : "");
button.innerHTML = `<span class="category-dot" style="background:${color}"></span>` +
`<span>${label}</span><span class="category-count">${count}</span>`;
button.addEventListener("click", () => {
selectedCategory = value;
expanded.clear();
buildCategoryFilters();
render();
});
host.appendChild(button);
};
addFilter("__all__", "ทั้งหมด", allTypes.size, "#02d767");
for (const category of categories) {
addFilter(category, category, typesByCategory.get(category).size, categoryColor(category));
}
}
function showBanner(msg, type) {
banner.textContent = msg;
banner.className = "banner wrap " + (type || "info");
banner.hidden = false;
}
function hideBanner() { banner.hidden = true; }
document.addEventListener("DOMContentLoaded", init);
})();
</script>
